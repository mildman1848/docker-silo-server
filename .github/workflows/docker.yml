name: Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      push:
        description: Push image to configured registries
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

env:
  IMAGE_NAME: silo-server
  UPSTREAM_REF: 881c96864bafec423f91438059b21b84a6f68686
  APP_VERSION: git-881c968
  IMAGE_REVISION: mldm2
  VERSION: git-881c968-mldm2

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      GITLAB_REGISTRY_USER: ${{ secrets.GITLAB_REGISTRY_USER }}
      GITLAB_REGISTRY_TOKEN: ${{ secrets.GITLAB_REGISTRY_TOKEN }}
      GITLAB_REGISTRY_IMAGE: ${{ vars.GITLAB_REGISTRY_IMAGE }}
      CODEBERG_REGISTRY_USER: ${{ secrets.CODEBERG_REGISTRY_USER }}
      CODEBERG_REGISTRY_TOKEN: ${{ secrets.CODEBERG_REGISTRY_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_pair: linux-amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            platform_pair: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'workflow_dispatch' && inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Login to Docker Hub
        if: github.event_name == 'workflow_dispatch' && inputs.push && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Login to GitLab Registry
        if: github.event_name == 'workflow_dispatch' && inputs.push && env.GITLAB_REGISTRY_USER != '' && env.GITLAB_REGISTRY_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: registry.gitlab.com
          username: ${{ env.GITLAB_REGISTRY_USER }}
          password: ${{ env.GITLAB_REGISTRY_TOKEN }}

      - name: Login to Codeberg Registry
        if: github.event_name == 'workflow_dispatch' && inputs.push && env.CODEBERG_REGISTRY_USER != '' && env.CODEBERG_REGISTRY_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: codeberg.org
          username: ${{ env.CODEBERG_REGISTRY_USER }}
          password: ${{ env.CODEBERG_REGISTRY_TOKEN }}

      - name: Resolve image targets
        id: images
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'images<<EOF'
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}"
            if [[ -n "${DOCKERHUB_USERNAME}" ]]; then
              echo "docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
            fi
            if [[ -n "${GITLAB_REGISTRY_USER}" ]]; then
              echo "registry.gitlab.com/${GITLAB_REGISTRY_IMAGE:-${GITHUB_REPOSITORY_OWNER}/${GITHUB_REPOSITORY#*/}}"
            fi
            if [[ -n "${CODEBERG_REGISTRY_USER}" ]]; then
              echo "codeberg.org/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Generate platform tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          suffix='${{ matrix.platform_pair }}'
          {
            echo 'tags<<EOF'
            while IFS= read -r image; do
              [[ -n "${image}" ]] || continue
              echo "${image}:${VERSION}-${suffix}"
            done <<< '${{ steps.images.outputs.images }}'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.push }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            UPSTREAM_REF=${{ env.UPSTREAM_REF }}
            APP_VERSION=${{ env.APP_VERSION }}
            IMAGE_REVISION=${{ env.IMAGE_REVISION }}
            VERSION=${{ env.VERSION }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.platform_pair }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform_pair }}
          provenance: true
          sbom: true

  merge:
    name: merge manifests
    if: github.event_name == 'workflow_dispatch' && inputs.push
    needs: build
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      GITLAB_REGISTRY_USER: ${{ secrets.GITLAB_REGISTRY_USER }}
      GITLAB_REGISTRY_TOKEN: ${{ secrets.GITLAB_REGISTRY_TOKEN }}
      GITLAB_REGISTRY_IMAGE: ${{ vars.GITLAB_REGISTRY_IMAGE }}
      CODEBERG_REGISTRY_USER: ${{ secrets.CODEBERG_REGISTRY_USER }}
      CODEBERG_REGISTRY_TOKEN: ${{ secrets.CODEBERG_REGISTRY_TOKEN }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Login to GitLab Registry
        if: env.GITLAB_REGISTRY_USER != '' && env.GITLAB_REGISTRY_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: registry.gitlab.com
          username: ${{ env.GITLAB_REGISTRY_USER }}
          password: ${{ env.GITLAB_REGISTRY_TOKEN }}

      - name: Login to Codeberg Registry
        if: env.CODEBERG_REGISTRY_USER != '' && env.CODEBERG_REGISTRY_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: codeberg.org
          username: ${{ env.CODEBERG_REGISTRY_USER }}
          password: ${{ env.CODEBERG_REGISTRY_TOKEN }}

      - name: Create and inspect manifests
        shell: bash
        run: |
          set -euo pipefail
          images=("ghcr.io/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}")
          if [[ -n "${DOCKERHUB_USERNAME}" ]]; then
            images+=("docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}")
          fi
          if [[ -n "${GITLAB_REGISTRY_USER}" ]]; then
            images+=("registry.gitlab.com/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}")
          fi
          if [[ -n "${CODEBERG_REGISTRY_USER}" ]]; then
            images+=("codeberg.org/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}")
          fi

          for image in "${images[@]}"; do
            docker buildx imagetools create \
              -t "${image}:${VERSION}" \
              -t "${image}:${APP_VERSION}" \
              -t "${image}:latest" \
              "${image}:${VERSION}-linux-amd64" \
              "${image}:${VERSION}-linux-arm64"
            docker buildx imagetools inspect "${image}:${VERSION}"
          done
