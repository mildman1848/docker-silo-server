name: Publish

on:
  workflow_dispatch:
    inputs:
      push:
        description: Push image to registries
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read
  packages: write

jobs:
  publish-ghcr:
    if: github.event.inputs.push == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mildman1848/silo-server:git-881c968-mldm1
            ghcr.io/mildman1848/silo-server:git-881c968
          build-args: |
            UPSTREAM_REF=881c96864bafec423f91438059b21b84a6f68686
            APP_VERSION=git-881c968
            IMAGE_REVISION=mldm1
            VERSION=git-881c968-mldm1
