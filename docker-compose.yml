services:
  postgres:
    image: ${POSTGRES_IMAGE:-ghcr.io/mildman1848/postgresql:18.4-mldm4}
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Berlin}
      POSTGRES_USER: ${POSTGRES_USER:-silo}
      FILE__POSTGRES_PASSWORD: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-silo}
    volumes:
      - ./data/postgres:/config
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-silo} -d $${POSTGRES_DB:-silo} -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: ${CACHE_IMAGE:-ghcr.io/mildman1848/valkey:9.0.4-mldm1}
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ./data/valkey:/config
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  silo:
    image: ${IMAGE_NAME:-ghcr.io/mildman1848/silo-server}:${IMAGE_TAG:-git-881c968-mldm1}
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Berlin}
      MODE: ${MODE:-integrated}
      FILE__SECRET_KEY: /run/secrets/silo_secret_key
      FILE__POSTGRES_PASSWORD: /run/secrets/postgres_password
      SILO_DB_HOST: postgres
      SILO_DB_PORT: "5432"
      SILO_DB_NAME: ${POSTGRES_DB:-silo}
      SILO_DB_USER: ${POSTGRES_USER:-silo}
      SILO_DB_SSLMODE: disable
      REDIS_URL: redis://redis:6379
      SILO_PLUGIN_CACHE_DIR: /config/plugins
      POSTGRES_TUNE: ${POSTGRES_TUNE:-off}
      SILO_PUBLIC_URL: ${SILO_PUBLIC_URL:-}
      SILO_TRUSTED_PROXIES: ${SILO_TRUSTED_PROXIES:-}
    ports:
      - "${PORT:-8090}:8080"
      - "${JF_PORT:-8096}:8096"
      - "${ABS_PORT:-13378}:13378"
    volumes:
      - ./config:/config
      - ./transcode:/transcode
      - ${MEDIA_ROOT:?Set MEDIA_ROOT in .env to the host media path}:/media:ro
      - /proc/meminfo:/host/proc/meminfo:ro
    devices:
      - /dev/dri:/dev/dri
    secrets:
      - silo_secret_key
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

secrets:
  silo_secret_key:
    file: ${SECRET_KEY_FILE:-./secrets/silo_secret_key}
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./secrets/postgres_password}
